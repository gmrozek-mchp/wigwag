# wigwag firmware configuration.
#
# Rule 5: every option here costs SRAM out of 8 KB, so each one is justified.

# PWM for the lamps. PWM_MCHP_TCC_G1 then defaults y off
# DT_HAS_MICROCHIP_TCC_G1_PWM_ENABLED, which the board overlay provides.
CONFIG_PWM=y

# Interrupt-driven receive on the module UART. Polled receive drops bytes: at the module's native
# 230400 one arrives every 43 us and the SERCOM has no deep FIFO, so a loop that also renders lamps
# would lose characters mid-line. Costs the driver's per-instance IRQ state plus our own 256-byte ring.
CONFIG_UART_INTERRUPT_DRIVEN=y

# GPIO, for the button on SW0. The lamps do not need it — they are PWM — so this exists solely to
# read one pin. Costs the port-g1 driver plus one device instance for portb, tens of bytes of RAM.
# The input subsystem is deliberately *not* enabled: the button is polled (D86), so gpio-keys is
# used only as the devicetree description.
CONFIG_GPIO=y

# The logging subsystem costs a thread, its stack and a ring buffer — more than this
# needs. printk straight to the console is enough, and keeps the driver's LOG_ERR calls from
# pulling the subsystem in.
CONFIG_LOG=n

# Interrupt stack, tuned on measured evidence (Rule 5). The default 2048 B is the single largest
# item in an 8 KB budget, and a full exercise peaks at **264 bytes** — the only interrupt sources
# here are systick and SERCOM0 receive, neither of which nests. 1024 keeps a 4x margin over the
# measurement while returning 1 KB, which is 12.5% of all the SRAM on the part.
#
# Measure again before trusting this if an interrupt source is added: see prj_stacks.conf.
CONFIG_ISR_STACK_SIZE=1024

# Watchdog. The last hole in fail-visible: link.c supervises the module, the broker and the host, but
# nothing supervises link.c — if the AT loop wedges, supervision wedges with it and the lamps freeze
# on a confident, stale display. Costs the driver plus one device instance.
CONFIG_WATCHDOG=y

# CONFIG_HWINFO is deliberately *not* enabled, even though the reset cause is exactly the kind of
# diagnostic this device needs. hwinfo_mchp_g1.c reads PL10's RCAUSE at the wrong offset with JH's
# bit positions, so it returns a confident wrong answer (see wdog_wdt.c and
# docs/upstreaming-to-zephyr.md). wdog_wdt.c reads the register itself instead, which also keeps the
# driver, its device instance and the syscall shims out of an 8 KB part.

# Self-programming, so credentials (D37/D56) and brightness can live in the 4 KB storage partition
# instead of being compiled into the image. Costs the driver plus one device instance, and 24 bytes
# of RAM for its mutex and cached geometry. Erase and write stall the CPU while they run, which is
# why the erase duration is measured against the watchdog's 500 ms budget rather than assumed
# (ADR-0016). The driver is out-of-tree in firmware/modules/ because PL10's NVMCTRL is a different
# peripheral revision from the one mainline's Microchip flash driver targets.
CONFIG_FLASH=y

# Persistent settings in the 4 KB storage partition, so credentials and calibration survive a reflash
# and no longer need a rebuild to change (D37/D56). NVS rather than a hand-rolled record because the
# hard part is consistency across a power cut mid-write; costs its struct nvs_fs plus the ~300 bytes
# of RAM the settings strings need, which used to be flash literals costing nothing.
CONFIG_NVS=y

# `reboot` over the console, so applying Wi-Fi changes does not mean reaching for the cable. Costs
# nothing in RAM: sys_reboot() is a write to the Cortex-M reset register.
CONFIG_REBOOT=y
