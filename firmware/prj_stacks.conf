# Stack measurement overlay — NOT for the shipping build.
#
# Rule 5 asks for measured footprint, not estimates, and stack sizes are the one part of this
# project's RAM that was chosen by feel. This turns them into numbers.
#
#   west build -p -b pic32cm_pl10_cnano firmware -d build/stacks \
#       -- -DEXTRA_CONF_FILE=prj_stacks.conf
#   west flash -d build/stacks
#   # then exercise the device HARD (see firmware/README.md) and read the console
#
# How it works: CONFIG_INIT_STACKS fills every stack with 0xaa before use — threads *and* the
# interrupt stack — so the high-water mark is wherever the pattern stops. THREAD_ANALYZER walks
# each stack looking for it and prints unused bytes per thread.
#
# The reported number is only as good as the exercise. A stack peak happens during the deepest
# call chain that has actually run, so anything not provoked is not measured: the AT connect
# script, a full-length command build (vsnprintf), the error and backoff paths, every lamp
# behaviour, and a link loss and recovery all need to occur before the numbers mean anything.

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10

# THREAD_ANALYZER selects INIT_STACKS, THREAD_MONITOR and THREAD_STACK_INFO for us, and analyses
# the interrupt stack by default (CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE) — which matters here,
# because z_interrupt_stacks is 2048 B, the single largest item in the budget.

# The analyzer's own thread needs room to run printk. This is measurement scaffolding, so it is
# allowed to be generous; it does not ship.
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=1024

# There is no MPU on PIC32CM PL10, so CONFIG_HW_STACK_PROTECTION is unavailable. The sentinel is
# the software substitute: a magic value at the bottom of each stack, checked periodically, which
# catches an overflow that has already happened rather than preventing it.
CONFIG_STACK_SENTINEL=y

# Names, so the report identifies threads instead of printing thread-object addresses.
CONFIG_THREAD_NAME=y
