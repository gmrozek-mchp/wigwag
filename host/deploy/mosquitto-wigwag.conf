# mosquitto configuration for wigwag.
#
# WHY YOU NEED THIS: mosquitto 2.x with no config file starts in "local only
# mode" and refuses every connection that is not from the same machine. It says
# so on startup:
#
#     Starting in local only mode. Connections will only be possible from
#     clients running on this machine. Create a configuration file which
#     defines a listener to allow remote access.
#
# That default is fine while you test the host software, and useless the moment
# the *device* tries to connect over Wi-Fi. Symptom: wigwagd works, the light
# never connects.
#
# Pick ONE of the two listener blocks below.
#
# Run it with:   mosquitto -c /path/to/mosquitto-wigwag.conf -v

# ---------------------------------------------------------------------------
# Option 1 — trusted network, no authentication (simplest)
# ---------------------------------------------------------------------------
# `listener <port>` with no bind address listens on all interfaces, which is
# what makes the device able to reach it. Only do this on a network you trust;
# anyone on it can then drive your light.

listener 1883
allow_anonymous true

# ---------------------------------------------------------------------------
# Option 2 — username + password (recommended)
# ---------------------------------------------------------------------------
# Comment out Option 1 above and uncomment this. Create the password file with:
#
#     mosquitto_passwd -c /etc/mosquitto/wigwag.passwd wigwag
#     # macOS/brew: /opt/homebrew/etc/mosquitto/wigwag.passwd
#
# Then point wigwagd at it with WIGWAG_MQTT_USERNAME / WIGWAG_MQTT_PASSWORD,
# and set the same credentials in firmware/credentials.conf for the device.
#
# listener 1883
# allow_anonymous false
# password_file /etc/mosquitto/wigwag.passwd

# ---------------------------------------------------------------------------
# Optional: TLS
# ---------------------------------------------------------------------------
# Only needed if the broker is reachable from outside a network you trust.
# wigwagd turns TLS on automatically for any non-loopback broker (ADR-0011),
# so if you enable this, use port 8883 and give wigwagd the CA certificate.
#
# listener 8883
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
# cafile   /etc/mosquitto/certs/ca.crt

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# Retained messages are how the light recovers its state on reconnect
# (ADR-0003). Persisting them means a broker *restart* also preserves state,
# rather than leaving the device showing nothing until the next change.

persistence true
# Debian/Ubuntu default: /var/lib/mosquitto/
# macOS/brew:            /opt/homebrew/var/lib/mosquitto/
# persistence_location /var/lib/mosquitto/

# Log to stdout so `-v` and service logs both work.
log_dest stdout
