[project]
name = "wigwag-host"
version = "0.1.0"
description = "Host daemon and CLI for wigwag, a physical status light for AI coding sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are deliberately minimal (CLAUDE.md: no new runtime deps
# without an ADR). Everything except MQTT publishing is stdlib, so the test suite
# and the pure logic run with nothing installed.
dependencies = [
    "paho-mqtt>=2.1",
]

# The wired transport only (ADR-0020). Optional because most installations publish to a
# broker and should not have to install a serial library to do it. pyserial is pure Python
# on every platform -- termios on POSIX, ctypes to Win32 -- so there is no build step.
[project.optional-dependencies]
serial = [
    "pyserial>=3.5",
]

[project.scripts]
wigwagd = "wigwagd.__main__:main"
wigwag = "wigwagd.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wigwagd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Keep the venv inside host/ so the polyglot repo root stays clean.
package = true
